<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block;position:absolute;top:0;left:0}</style></head>
<body><canvas id="gl" width="540" height="675" style="display:none"></canvas><canvas id="c" width="1080" height="1350"></canvas>
<script src="engine.js"></script><script src="type.js"></script><script src="prims.js"></script><script src="grabby.js"></script>
<script>
(async()=>{
  await ENGINE.loadFonts(); ENGINE.initGL(); ENGINE.init2d(); ENGINE.initGrain();
  const E=ENGINE, P=PRIM;
  window.renderFrame=(t)=>{
    const ctx=E.ctx;
    E.sky({t, top:'#2c5f9e', bot:'#f4dcc0', horizon:'#ffc861', cloud:0.35, sun:0.35, sunPos:[0.5,0.15], glowR:0.5});
    ctx.drawImage(E.glCanvas,0,0,1080,1350);
    P.enso(540,620,300,1);
    GRABBY.grabby(t,540,650,150,{arm:{ext:0,open:1},eyes:'closed'});
    P.motes(t,{count:60});
    TYPE.drawCaption(5, TYPE.caption('you are the sky', [0,0.2,0.4,0.6], {style:'hook', y:1120, t1:99}));
    E.grain(t,0.06);
  };
  window.READY=true;
})();
</script></body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<base href="../../">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;position:absolute;top:0;left:0}</style>
</head>
<body>
<canvas id="lxgl" width="1080" height="1350" style="display:none"></canvas>
<canvas id="gl" width="540" height="675" style="display:none"></canvas>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="engine.js"></script>
<script src="timing.js"></script>
<script src="lookdev/pool/lx.js"></script>
<script src="lookdev/pool/light.js"></script>
<script src="lookdev/pool/grab.js"></script>
<script src="lookdev/pool/scenes.js"></script>
<script>
// "Hockney pool light" lookdev. renderFrame(t) is deterministic.
// ?sync=1 -> captions ignite strictly on timing.js word onsets (default: style-frame preview shows the whole line lit).
(async () => {
  await ENGINE.loadFonts();
  const extra = [
    ['Fraunces', 'fraunces-latin-600-italic.woff2', '600', 'italic'],
    ['Fraunces', 'fraunces-latin-800-italic.woff2', '800', 'italic'],
    ['Fraunces', 'fraunces-latin-500-italic.woff2', '500', 'italic'],
  ];
  await Promise.all(extra.map(async ([fam, file, w, s]) => { try { const f = new FontFace(fam, `url(fonts/${file})`, { weight: w, style: s }); await f.load(); document.fonts.add(f); } catch (e) { console.warn('font', file, e.message); } }));
  const Q = new URLSearchParams(location.search);
  window.SYNC = Q.get('sync') === '1';
  window.SKIP = Object.fromEntries((Q.get('skip') || '').split(',').filter(Boolean).map(k => [k, 1]));
  ENGINE.init2d();
  LX.ctx = ENGINE.ctx;
  LX.initGL();
  PL.init();
  SC.init();
  window.renderFrame = (t) => SC.draw(t);
  window.READY = true;
})();
</script>
</body></html>

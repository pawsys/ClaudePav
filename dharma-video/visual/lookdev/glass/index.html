<!doctype html>
<html><head><meta charset="utf-8">
<base href="../../">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;position:absolute;top:0;left:0}</style>
</head>
<body>
<canvas id="lxgl" width="1080" height="1350" style="display:none"></canvas>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="engine.js"></script>
<script src="timing.js"></script>
<script src="lookdev/glass/lx.js"></script>
<script src="lookdev/glass/glass.js"></script>
<script src="lookdev/glass/grab.js"></script>
<script src="lookdev/glass/scenes.js"></script>
<script>
// UNCLENCH v2 lookdev, direction "translucent glass and prism".
// renderFrame(t): deterministic, t in seconds (0..60 loop). Same contract as visual/index.html.
(async () => {
  await ENGINE.loadFonts();
  const extra = [
    ['DM Serif Display', 'fonts/dm-serif-display-latin-400-italic.woff2', '400', 'italic'],
    ['DM Serif Display', 'fonts/dm-serif-display-latin-400-normal.woff2', '400', 'normal'],
  ];
  await Promise.all(extra.map(async ([fam, url, weight, style]) => {
    try { const f = new FontFace(fam, `url(${url})`, { weight, style }); await f.load(); document.fonts.add(f); } catch (e) { console.warn('font fail', url, e.message); }
  }));
  ENGINE.init2d();
  LX.ctx = ENGINE.ctx;
  G.init();
  window.renderFrame = (t) => { GLASS_DRAW(t); };
  window.READY = true;
})();
</script>
</body></html>

     Render: cd visual && node render.js --page v2/index.html --stills 0,12.5 --outdir ../out/v2/stills

     ?qa=1 records every laid-out word box per frame in V2.QA.words (check/contrast.js).
     Act builders: edit ONLY your own marked HELPERS block below (and your actN.js). Everything else is core. -->
<style>html,body{margin:0;background:#120A3E;overflow:hidden}canvas{display:block;position:absolute;top:0;left:0}</style>
</head>
<body>
<canvas id="lxgl" width="540" height="675" style="display:none"></canvas>

<script src="v2/act3.js"></script>
<script>
(async () => {
  await ENGINE.loadFonts();
  // extra Fraunces faces for the open half (LOOK 2.11)
  const extra = [
    ['Fraunces', 'fonts/fraunces-latin-400-normal.woff2', '400', 'normal'],
    ['Fraunces', 'fonts/fraunces-latin-600-italic.woff2', '600', 'italic'],
    ['Fraunces', 'fonts/fraunces-latin-700-italic.woff2', '700', 'italic'],
    ['Fraunces', 'fonts/fraunces-latin-900-italic.woff2', '900', 'italic'],
    ['Anton', 'fonts/anton-latin-ext-400-normal.woff2', '400', 'normal'],
  ];
  await Promise.all(extra.map(async ([fam, url, weight, style]) => {
    try { const f = new FontFace(fam, `url(${url})`, { weight, style }); await f.load(); document.fonts.add(f); } catch (e) { console.warn('font fail', url, e.message); }
  }));
  V2.init();                                   // GL + every registered program compiled before READY
  window.renderFrame = t => V2.draw(t);
  window.READY = true;
})();
</script>
